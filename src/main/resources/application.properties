spring.application.name=hustle-backend
server.port=8080

# ===============================
# Default Database: In-Memory H2
# ===============================
spring.datasource.url=jdbc:h2:mem:hustledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Multipart File Upload Config
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# Application Custom Properties
# ===============================
# Local directory where uploaded product images are saved
app.upload.dir=uploads/products

# JWT Security Configuration (Secret is a 256-bit base64/hex key)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS Allowed Origins (Angular Hustle Web & Admin clients)
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:3000

# ===============================
# Swagger / OpenAPI Documentation
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
